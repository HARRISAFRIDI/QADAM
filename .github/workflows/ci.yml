name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qadam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qadam_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - name: requirements.txt is clean (encoding, syntax, pins)
        run: |
          pip install packaging==26.4
          python scripts/check_requirements.py requirements.txt
      - name: Install runtime deps in a fresh venv (exactly what Vercel installs)
        run: |
          python -m venv /tmp/runtime && /tmp/runtime/bin/pip install -r requirements.txt
          DATABASE_URL=postgresql://x@localhost/x SECRET_KEY=ci-secret-key-0123456789-0123456789 /tmp/runtime/bin/python -c "import main; print('FastAPI app imports OK')"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
